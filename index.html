<style>
  /* Layout concept: a 1280px architectural frame bounded by 1px guide lines; horizontal rules carry crosshair markers where they meet the guides. */
  :root{
    --carbon:#0A0B0A; --slate:#111311; --paper:#F3F4F1; --ash:#8C928D; --volt:#D2FF28;
    --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444;
    --line:rgba(243,244,241,.14); --line-strong:rgba(243,244,241,.30);

  html{scroll-behavior:smooth}

  .rule{position:relative;height:0;border-top:1px solid var(--line)}

  .navlink{font:500 11px/1 var(--mono);letter-spacing:.08em;color:var(--ash);transition:color .15s}
  .navlink:hover{color:var(--paper)}
  .header-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .login-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 13px;font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--paper);border:1px solid var(--line-strong);border-radius:2px;text-decoration:none;white-space:nowrap}
  .login-link:hover{color:var(--volt);border-color:var(--volt)}

  .btn-volt{background:var(--volt);color:#0A0B0A;border-color:var(--volt)}
  .btn-volt:hover{background:#e3ff6b;border-color:#e3ff6b}

  .btn:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--volt);outline-offset:2px}

  .gridbg-fade{background:radial-gradient(ellipse at center,rgba(10,11,10,0) 0,var(--carbon) 78%)}

  .island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#000;border-radius:12px;z-index:5}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font:700 9.5px/1 var(--mono);letter-spacing:.06em;padding:8px 9px;border-radius:2px;border:1px solid var(--line-strong);color:var(--ash);background:transparent;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--volt);color:#0A0B0A;border-color:var(--volt)}

  .vp svg{position:absolute;inset:0;width:100%;height:100%}
  .scanline{position:absolute;left:0;right:0;height:2px;background:var(--volt);box-shadow:0 0 14px 2px rgba(210,255,40,.45);animation:scan 1.7s linear infinite;z-index:3}
  @keyframes scan{from{top:0}to{top:100%}}
  .reticle{position:absolute;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);cursor:pointer;padding:0;animation:pop .28s ease-out both;z-index:2}
  .reticle[data-active="true"]{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c);z-index:4}
  .reticle i{position:absolute;width:7px;height:7px;border:2px solid var(--c)}
  .reticle i.tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
  .reticle i.tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
  .reticle i.bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
  .reticle i.br{right:-2px;bottom:-2px;border-left:0;border-top:0}
  .reticle b{position:absolute;left:-1px;bottom:100%;font:700 8px/1 var(--mono);letter-spacing:.04em;background:var(--c);color:#0A0B0A;padding:2px 4px;white-space:nowrap}
  @keyframes pop{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
  .frow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;text-align:left;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--paper);cursor:pointer}
  .frow[data-active="true"]{background:rgba(243,244,241,.06)}
  .sq{display:inline-block;width:8px;height:8px;flex:none}
  .field{width:100%;background:var(--carbon);border:1px solid var(--line-strong);border-radius:2px;color:var(--paper);padding:12px 12px;font:400 15px/1.3 var(--body);transition:border-color .15s}
  .field:focus{outline:none;border-color:var(--volt)}
  .field::placeholder{color:#5d625e}
  select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ash) 50%),linear-gradient(135deg,var(--ash) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .lbl{display:block;font:500 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--ash);margin-bottom:8px}
  .wordmark{font:700 clamp(40px,12.4vw,168px)/.82 var(--display);letter-spacing:-.045em;color:var(--slate);-webkit-text-stroke:1px var(--line-strong);white-space:nowrap;text-align:center;user-select:none}
  .sheet{background:var(--paper);color:#0A0B0A}
  .sheet th{font:500 10px/1 var(--mono);letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid #0A0B0A;color:#444}
  .sheet td{padding:9px 10px;border-bottom:1px solid #cfd2cc;font-size:13px;vertical-align:top}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scanline{animation:none;display:none}.reticle{animation:none}*{transition:none!important}}
</style>

function Booking(){
  const [v,setV]=useState({name:'',facility:'',email:'',county:'',type:'Cultivation',rooms:'1 to 3 rooms',notes:''});
  const [err,setErr]=useState({});
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saveError,setSaveError]=useState('');
  const [requestId,setRequestId]=useState(()=>crypto.randomUUID());
  const [reference,setReference]=useState('');
  const [website,setWebsite]=useState('');
  const [copied,setCopied]=useState(false);
  const set=k=>e=>{setV(Object.assign({},v,{[k]:e.target.value}));setRequestId(crypto.randomUUID());setSaveError('');};
  const submit=async e=>{
    e.preventDefault();
    if(saving) return;
    const er={};
    if(!v.name.trim()) er.name='Enter your name.';
    if(!v.facility.trim()) er.facility='Enter your facility name.';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) er.email='Enter a valid email address.';
    setErr(er);
    if(Object.keys(er).length) return;
    setSaving(true);
    setSaveError('');
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),20000);
    try {
      const response=await fetch('/api/leads',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...v,requestId,website}),
        signal:controller.signal
      });
      const result=await response.json().catch(()=>null);
      if(!response.ok || result?.ok!==true || typeof result.id!=='string') {
        throw new Error(result?.error || 'We could not confirm your request. Please retry.');
      }
      setReference(result.id);
      setDone(true);
    } catch(error) {
      setSaveError(error?.name==='AbortError'
        ? 'The connection timed out. Please retry; retrying the same request will not save it twice.'
        : error instanceof Error ? error.message : 'Could not save your request. Please retry.');
    } finally {
      clearTimeout(timeout);
      setSaving(false);
    }
  };
  const body=`GrowView AI pilot walkthrough request\nName: ${v.name}\nFacility: ${v.facility}\nEmail: ${v.email}\nCounty / city: ${v.county||'n/a'}\nLicense type: ${v.type}\nRooms: ${v.rooms}\nNotes: ${v.notes||'none'}`;
  const doCopy=(t,setter)=>copyText(t,ok=>{ setter(ok); setTimeout(()=>setter(false),1800); });
  const [mailCopied,setMailCopied]=useState(false);
  const field=(id,label,props,error)=>html`<div><label class="lbl" for=${id}>${label}</label>${props.tag==='select'
      ? html`<select id=${id} class="field" disabled=${saving} value=${v[props.k]} onChange=${set(props.k)}>${props.opts.map(o=>html`<option key=${o}>${o}</option>`)}</select>`
      : props.tag==='textarea'
      ? html`<textarea id=${id} class="field" disabled=${saving} maxLength="3000" rows="3" placeholder=${props.ph} value=${v[props.k]} onChange=${set(props.k)}></textarea>`
      : html`<input id=${id} class="field" disabled=${saving} maxLength=${({name:120,facility:200,email:254,county:160})[props.k]} type=${props.type||'text'} placeholder=${props.ph} value=${v[props.k]} onChange=${set(props.k)} aria-invalid=${!!error}/>`}
      ${error && html`<div class="text-[12.5px] mt-2" style=${{color:'var(--bad)'}}>${error}</div>`}</div>`;
  return html`<section id="booking"><div class="frame"><div class="grid lg:grid-cols-2">
    <div class="gut py-16" style=${{minWidth:0}}>
      <${Eyebrow}>PILOT WALKTHROUGH<//>
      <h2 class="font-display font-bold mt-5 text-[32px] sm:text-[44px]" style=${{lineHeight:1,letterSpacing:'-.025em',textWrap:'balance'}}>Book a free audit of your facility.</h2>
      <p class="text-[16px] text-ash mt-5" style=${{maxWidth:'46ch'}}>We walk two or three rooms with you, scan them live, and leave you with the punch list. No contract and no data pull from your state systems.</p>
      <div class="mt-10" style=${{borderTop:'1px solid var(--line)'}}>
        <div class="flex items-center gap-4 py-4" style=${{borderBottom:'1px solid var(--line)'}}><${Mail} size=${18} className="text-volt"/><div class="flex-1 min-w-0"><div class="mono text-[10px] text-ash">EMAIL</div><div class="mono text-[15px] mt-1 select-all break-all">hello@growview.app</div></div>
          <button class="btn btn-ghost" style=${{padding:'9px 11px',fontSize:'10.5px'}} onClick=${()=>doCopy('hello@growview.app',setMailCopied)}>${mailCopied?'COPIED':'COPY'}</button></div>
        <div class="flex items-center gap-4 py-4" style=${{borderBottom:'1px solid var(--line)'}}><${MapPin} size=${18} className="text-volt"/><div><div class="mono text-[10px] text-ash">BASED IN</div><div class="mono text-[15px] mt-1">Norman, OK</div></div></div>
      </div>
    </div>
    <div class="gut py-16 lg:border-l" style=${{borderColor:'var(--line)',background:'var(--slate)',minWidth:0}}>
      ${!done ? html`<form onSubmit=${submit} noValidate aria-busy=${saving} class="grid gap-5">
        <div class="mono text-[11px] text-ash">INTAKE FORM // 3 REQUIRED FIELDS</div>
        <div class="grid sm:grid-cols-2 gap-5">${field('f-name','YOUR NAME',{k:'name',ph:'Full name'},err.name)}${field('f-fac','FACILITY NAME',{k:'facility',ph:'Licensed business name'},err.facility)}</div>
        ${field('f-email','EMAIL',{k:'email',type:'email',ph:'you@facility.com'},err.email)}
        <div class="grid sm:grid-cols-2 gap-5">${field('f-county','CITY OR COUNTY',{k:'county',ph:'Cleveland County'})}${field('f-type','LICENSE TYPE',{k:'type',tag:'select',opts:['Cultivation','Processing','Dispensary','More than one license']})}</div>
        ${field('f-rooms','ROOMS TO AUDIT',{k:'rooms',tag:'select',opts:['1 to 3 rooms','4 to 8 rooms','9 or more rooms']})}
        ${field('f-notes','ANYTHING WE SHOULD KNOW',{k:'notes',tag:'textarea',ph:'Upcoming inspection date, problem areas, access rules'})}
        <div aria-hidden="true" style=${{position:'absolute',left:'-10000px',width:'1px',height:'1px',overflow:'hidden'}}><label for="f-website">Leave this field blank</label><input id="f-website" name="website" type="text" tabIndex="-1" autoComplete="off" value=${website} onChange=${e=>setWebsite(e.target.value)}/></div>
        ${saveError && html`<p role="alert" class="text-[14px]" style=${{color:'var(--bad)'}}>${saveError}</p>`}
        <button type="submit" disabled=${saving} class="btn btn-volt w-full" style=${{minHeight:'48px',opacity:saving ? .65 : 1}}>${saving?'SAVING REQUEST…':'REQUEST FREE AUDIT'} <${ArrowRight} size=${15}/></button>
      </form>` : html`<div>
        <div role="status" class="flex items-center gap-3 mono text-[11px] text-volt"><${Check} size=${16}/>REQUEST SAVED</div>
        <h3 class="font-display font-semibold text-[26px] mt-4" style=${{lineHeight:1.1}}>Your audit request is saved.</h3>
        <p class="text-[14.5px] text-ash mt-3">Your details have been securely recorded for the GrowView team. You do not need to copy or email this request.</p>
        <p class="mono text-[10.5px] text-ash mt-3" style=${{wordBreak:'break-all'}}>REFERENCE: ${reference}</p>
        <pre class="mono text-[11.5px] mt-5 p-4 overflow-x-auto" style=${{background:'var(--carbon)',border:'1px solid var(--line-strong)',borderRadius:'2px',whiteSpace:'pre-wrap',wordBreak:'break-word',letterSpacing:0}}>${body}</pre>
        <div class="flex flex-wrap gap-3 mt-5"><button class="btn btn-volt" onClick=${()=>doCopy(body,setCopied)}><${copied?Check:Copy} size=${15}/>${copied?'COPIED':'COPY DETAILS'}</button></div>
      </div>`}
    </div>
  </div></div><${Rule}/></section>`;
}

function Footer(){
  return html`<footer><div class="frame">
    <div class="gut pt-14 pb-6" style=${{overflow:'hidden'}}><div class="wordmark" aria-label="GrowView AI">GROWVIEW AI</div></div>
    <div style=${{borderTop:'1px solid var(--line)'}} class="gut py-5 flex flex-wrap items-center justify-between gap-x-8 gap-y-3 mono text-[10.5px] text-ash">
      <span>© 2026 GROWVIEW AI · NORMAN, OKLAHOMA</span>
      <span>GROWVIEW.APP · PILOT BUILD</span>
      <span class="basis-full leading-relaxed" style=${{letterSpacing:'.02em'}}>GrowView AI is a documentation aid. It does not replace OMMA or OSHA requirements, official inspections or legal advice.</span>
    </div>
  </div></footer>`;
}

function App(){
  return html`<div class="page"><${Nav}/><main><${Hero}/><${Rule}/><${Why}/><${How}/><${Modules}/><${Booking}/></main><${Footer}/></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body>
</html>
